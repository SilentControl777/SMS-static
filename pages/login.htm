<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Login | Share Management System</title>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="">
		<meta name="author" content="">
		<link rel="stylesheet" type="text/css" href="../css/main.css">
	</head>
	<body class="sidebar-toggled">
		<!-- Page Wrapper Start -->
		<div id="wrapper">
			<!-- Login Page only Illustration Start -->
			<object type="image/svg+xml" data="../images/illustrations/login.svg" class="img-fluid" id="login-illustration">
			Login Illustrations
			</object>
			<!-- Login Page only Illustration End -->
			<!-- Content Wrapper Start -->
			<div id="content-wrapper" class="d-flex flex-column">
				<!-- Main Content Start -->
				<div id="content">
					<!-- Page Content Start -->
					<div class="row align-items-center h-100">
						<!-- Login Container Start -->
						<div class="col-xs-12 col-sm-12 col-md-9 col-lg-8 col-xl-6 mx-auto sms-login-container">
							<div class="row">
								<div class="col-xs-12 col-sm-12 col-md-9 col-lg-6 col-xl-6 d-flex align-items-center justify-content-center sms-logo">
									<img src="../images/common/logo.png" alt="Logo" class="img-fluid">
								</div>
								<!-- Login Form Start -->
								<div class="col-xs-12 col-sm-12 col-md-9 col-lg-6 col-xl-6 sms-login-form">
									<form>
										<h2 class="heading-text">Login</h2>
										<div class="form-group">
											<label class="label-text" for="login-shareholder-id">Shareholder ID</label>
											<input type="text" class="form-control primary-input" id="login-shareholder-id" aria-describedby="shareholder-id-help" placeholder="Enter Shareholder ID">
											<!-- <small id="shareholder-id-help" class="form-text text-muted">Error Message.</small> -->
										</div>
										<div class="form-group">
											<label class="label-text" for="login-password">Password</label>
											<input type="password" class="form-control primary-input" id="login-password" aria-describedby="password-help" placeholder="Enter Password">
											<!-- <small id="password-help" class="form-text text-muted">Error Message.</small> -->
										</div>
										<div class="form-group">
											<label class="label-text" for="login-language">Language</label>
											<select class="form-control" data-jcf='{"wrapNative": false, "wrapNativeOnMobile": false, "fakeDropInBody": false, "useCustomScroll": false}' aria-describedby="language-help" id="login-language">
												<option value="language">Select Language</option>
												<option class="optionText" value="Myanmar">Myanmar</option>
												<option class="optionText" value="English">English</option>
											</select>
											<!-- <small id="language-help" class="form-text text-muted">Error Message.</small> -->
										</div>
										<button class="btn primary-btn">Login</button>
									</form>
								</div>
								<!-- Login Form End -->
							</div>
						</div>
						<!-- Login Container End -->
					</div>
					<!-- Page Content End -->
				</div>
				<!-- Main Content End -->
			</div>
			<!-- Content Wrapper End -->
		</div>
		<!-- Page Wrapper End -->
		<!-- Jquery & Bootstrap Core JavaScript-->
		<script src="../js/vendors/jqueryv3.4.1/jquery.min.js"></script>
		<script src="../js/vendors/bootstrapv4.3.1/bootstrap.min.js"></script>
		<!-- Custom Form Components -->
		<script src="../js/vendors/customform/js/jcf.js"></script>
		<script src="../js/vendors/customform/js/jcf.number.js"></script>
		<script src="../js/vendors/customform/js/jcf.file.js"></script>
		<script src="../js/vendors/customform/js/jcf.select.js"></script>
		<script src="../js/vendors/customform/js/jcf.checkbox.js"></script>
		<script src="../js/vendors/customform/js/jcf.radio.js"></script>
		<!-- Custom scripts for all pages-->
		<script src="../js/script.js"></script>
	</body>
</html>
